<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Audio to report, six steps. Stations derived from label widths
       (tile-system stations(): first and last inset by half a label so the
       legend lands flush on both margins). The spine is a chart element.
       Live node on the report: the only thing the customer ever sees. -->
  <rect width="1280" height="720" fill="#23201b"/>
  <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#ece8e1" stroke-opacity="0.10"/>

  <text x="64" y="96" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="4" fill="#ece8e1" fill-opacity="0.45">FROM AUDIO TO REPORT · SIX STEPS</text>

  <text x="64" y="270" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="130" font-weight="600" fill="#ece8e1" fill-opacity="0.95">01</text>
  <text x="64" y="320" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">THE ONLY STEP THE TECHNICIAN IS IN</text>

  <line x1="105" y1="480" x2="1166.8" y2="480" stroke="#ece8e1" stroke-opacity="0.25" stroke-width="2"/>

  <circle cx="105" cy="480" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="317.4" cy="480" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="529.7" cy="480" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="742.1" cy="480" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="954.4" cy="480" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="1166.8" cy="480" r="36" fill="#f04a00" fill-opacity="0.12"/>
  <circle cx="1166.8" cy="480" r="15" fill="#f04a00"/>

  <g text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">
    <text x="105" y="436">01</text>
    <text x="317.4" y="436">02</text>
    <text x="529.7" y="436">03</text>
    <text x="742.1" y="436">04</text>
    <text x="954.4" y="436">05</text>
    <text x="1166.8" y="436">06</text>
  </g>

  <g text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">
    <text x="105" y="548">AUDIO</text>
    <text x="317.4" y="548">ACK</text>
    <text x="529.7" y="548">TRANSCRIBE</text>
    <text x="742.1" y="548">STRUCTURE</text>
    <text x="954.4" y="548">ASK</text>
    <text x="1166.8" y="548">REPORT</text>
  </g>

  <text x="64" y="660" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="3" fill="#ece8e1" fill-opacity="0.45">STEPS 02 TO 06 RUN WHILE HE DRIVES BACK.</text>
</svg>
