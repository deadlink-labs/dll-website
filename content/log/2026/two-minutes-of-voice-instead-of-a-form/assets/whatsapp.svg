<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- The follow-up exchange, verbatim and in Spanish, because that is what the
       artifact is. Message blocks are filled areas, not outlined bubbles: the
       system has no skeuomorphism and no separator hairlines. Live node marks
       the close. English caption in the post carries the meaning. -->
  <rect width="1280" height="720" fill="#23201b"/>
  <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#ece8e1" stroke-opacity="0.10"/>

  <text x="64" y="96" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="4" fill="#ece8e1" fill-opacity="0.45">THE FOLLOW-UP, IN HIS OWN REGISTER</text>

  <!-- 01 · the system asks for everything it is missing, once -->
  <rect x="64" y="148" width="588" height="200" rx="4" fill="#ece8e1" fill-opacity="0.06"/>
  <text x="92" y="194" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="26" fill="#ece8e1" fill-opacity="0.75">Me falta poco para cerrar:</text>
  <text x="92" y="240" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="26" fill="#ece8e1" fill-opacity="0.55">· ¿N.º de serie del intercambiador?</text>
  <text x="92" y="278" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="26" fill="#ece8e1" fill-opacity="0.55">· ¿Qué repuestos usaste?</text>
  <text x="92" y="316" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="26" fill="#ece8e1" fill-opacity="0.55">· ¿A qué hora terminaste?</text>
  <text x="624" y="338" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="20" fill="#ece8e1" fill-opacity="0.45">17:38</text>

  <!-- 02 · he answers in ten seconds, from the van. Blocks hug their content. -->
  <rect x="752" y="376" width="464" height="142" rx="4" fill="#ece8e1" fill-opacity="0.11"/>
  <text x="1188" y="424" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="26" fill="#ece8e1" fill-opacity="0.75">AX-40-2219, dos juntas NBR</text>
  <text x="1188" y="460" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="26" fill="#ece8e1" fill-opacity="0.75">y terminé 17:40</text>
  <text x="1188" y="498" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="20" fill="#ece8e1" fill-opacity="0.45">17:41</text>

  <!-- 03 · closed -->
  <rect x="64" y="546" width="500" height="86" rx="4" fill="#ece8e1" fill-opacity="0.06"/>
  <text x="92" y="598" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="26" fill="#ece8e1" fill-opacity="0.75">Listo. Generando el informe.</text>

  <circle cx="608" cy="589" r="36" fill="#f04a00" fill-opacity="0.12"/>
  <circle cx="608" cy="589" r="15" fill="#f04a00"/>

  <text x="1216" y="620" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="120" font-weight="600" fill="#ece8e1" fill-opacity="0.95">1</text>
  <text x="1216" y="660" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="26" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">ROUND · REPORT CLOSED</text>
</svg>
