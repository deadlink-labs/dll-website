<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- The flow, and the trust boundary around it. Everything inside the frame
       runs on the customer's own server; one dashed line leaves it, and that is
       the model call.
       The dashes on class="flow" are animated by src/pages/log/[slug].astro
       (@keyframes specimen-flow), which is why the dasharray is declared here
       and only the motion lives in CSS: without the page, this is still a
       dashed diagram. The live node is the one step that needs judgement. -->
  <rect width="1280" height="720" fill="#23201b"/>
  <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#ece8e1" stroke-opacity="0.10"/>

  <text x="64" y="96" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="4" fill="#ece8e1" fill-opacity="0.45">THE FLOW · ONE OUTBOUND CALL</text>

  <!-- A one-glyph hero loses to a nine-glyph secondary on sheer area, so the
       hero carries the whole ratio and the cost drops to the 56 tier. -->
  <text x="64" y="222" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="120" font-weight="600" fill="#ece8e1" fill-opacity="0.95">1 OF 10</text>
  <text x="64" y="266" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">STEPS NEEDS JUDGEMENT</text>

  <text x="1216" y="222" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="56" font-weight="600" fill="#ece8e1" fill-opacity="0.72">~USD 3.30</text>
  <text x="1216" y="262" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">PER MONTH AT 100 SERVICES</text>

  <!-- The trust boundary. A frame, not a divider: it says what is inside. -->
  <text x="64" y="316" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="3" fill="#ece8e1" fill-opacity="0.45">CLIENT SERVER · INTRANET · DOCKER</text>
  <rect x="64" y="330" width="1152" height="250" rx="4" fill="none" stroke="#ece8e1" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- The chain -->
  <line class="flow" x1="187.6" y1="420" x2="348.0" y2="420" stroke="#ece8e1" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>
  <line class="flow" x1="384.0" y1="420" x2="518.0" y2="420" stroke="#ece8e1" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>
  <line class="flow" x1="604.3" y1="420" x2="740.7" y2="420" stroke="#ece8e1" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>
  <line class="flow" x1="776.7" y1="420" x2="937.0" y2="420" stroke="#ece8e1" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>
  <line class="flow" x1="973.0" y1="420" x2="1133.4" y2="420" stroke="#ece8e1" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- The ask-again loop, capped at two rounds -->
  <path class="flow" d="M758.7,406 L758.7,368 L562.3,368 L562.3,384" fill="none" stroke="#ece8e1" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="660.5" y="352" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">ASK AGAIN · MAX 2</text>

  <circle cx="169.6" cy="420" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="366" cy="420" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="758.7" cy="420" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="955" cy="420" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="1151.4" cy="420" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>

  <circle cx="562.3" cy="420" r="36" fill="#f04a00" fill-opacity="0.12"/>
  <circle cx="562.3" cy="420" r="15" fill="#f04a00"/>

  <g text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">
    <text x="169.6" y="476">WHATSAPP</text>
    <text x="366" y="476">WHISPER</text>
    <text x="562.3" y="476">CLAUDE</text>
    <text x="758.7" y="476">COMPLETE?</text>
    <text x="955" y="476">POSTGRES</text>
    <text x="1151.4" y="476">PDF</text>
  </g>

  <g text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" fill="#ece8e1" fill-opacity="0.45">
    <text x="169.6" y="508">trigger</text>
    <text x="366" y="508">transcribe</text>
    <text x="562.3" y="508">structure</text>
    <text x="758.7" y="508">if</text>
    <text x="955" y="508">store</text>
    <text x="1151.4" y="508">render</text>
  </g>

  <!-- The only line that crosses the wall -->
  <line class="flow" x1="562.3" y1="544" x2="562.3" y2="604" stroke="#ece8e1" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="600" y="596" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">LLM API · THE ONLY CALL THAT LEAVES</text>

  <text x="64" y="660" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="3" fill="#ece8e1" fill-opacity="0.45">THE AUDIO IS TRANSCRIBED INSIDE. IT NEVER LEAVES.</text>
</svg>
