  <!-- ===================================================================
       THE n8n CANVAS - lifted from the client deck, not redrawn.
       Source: Claude Design "Plantilla Pitch Consultoria", slide 08.
       Carries no client name; the workflow is named for what it does.

       Self-contained on purpose. The keyframe and the reduced-motion
       guard live in this file rather than in the page, so it still
       animates opened on its own, in Obsidian, or anywhere else. The
       page adds nothing.

       Palette is the deck's own (tokens/colors.css):
         #2C566E steel   infrastructure and data
         #C0451A accent  the one step that needs judgement
         #F4F2EE canvas  #D3CFC7 lines  #8A8377 muted
       Type is deliberately mixed: Plex Sans for node titles, Plex Mono
       for the sublabels. remark-svg-specimen must NOT strip these.
       =================================================================== -->
