<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <rect width="1200" height="860" fill="#f7f6f3"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#e4e0d9" stroke-width="1"/>
  <text x="40" y="34" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#191817" font-weight="600">TRADE OUTREACH</text>
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" letter-spacing="1">
    <text x="694" y="33" fill="#1d5b48" font-weight="600">OVERVIEW</text>
    <text x="795" y="33" fill="#6b6862">QUEUE</text>
    <text x="867" y="33" fill="#6b6862">SYNC</text>
    <text x="929" y="33" fill="#6b6862">SHOPS</text>
    <text x="1001" y="33" fill="#6b6862">CONNECTIONS</text>
    <text x="1131" y="33" fill="#6b6862">MAP</text>
  </g>
  <rect x="694" y="42" width="77" height="2" fill="#1d5b48"/>

  <!-- stat tiles -->
  <g font-family="'IBM Plex Mono', ui-monospace, monospace">
    <!-- to write -->
    <rect x="40" y="100" width="178" height="104" rx="6" fill="#ffffff" stroke="#e4e0d9"/>
    <text x="62" y="130" font-size="12" letter-spacing="1.5" fill="#6b6862">TO WRITE</text>
    <text x="62" y="176" font-size="40" font-weight="600" fill="#1d5b48">9</text>

    <!-- top priority -->
    <rect x="228" y="100" width="178" height="104" rx="6" fill="#ffffff" stroke="#e4e0d9"/>
    <text x="250" y="130" font-size="12" letter-spacing="1.5" fill="#6b6862">TOP PRIORITY</text>
    <text x="250" y="176" font-size="40" font-weight="600" fill="#a82e19">3</text>

    <!-- follow-ups due -->
    <rect x="416" y="100" width="178" height="104" rx="6" fill="#ffffff" stroke="#e4e0d9"/>
    <text x="438" y="130" font-size="12" letter-spacing="1.5" fill="#6b6862">FOLLOW-UPS DUE</text>
    <text x="438" y="176" font-size="40" font-weight="600" fill="#8f5a06">2</text>

    <!-- partners -->
    <rect x="604" y="100" width="178" height="104" rx="6" fill="#ffffff" stroke="#e4e0d9"/>
    <text x="626" y="130" font-size="12" letter-spacing="1.5" fill="#6b6862">DEALERS</text>
    <text x="626" y="176" font-size="40" font-weight="600" fill="#191817">6</text>

    <!-- organizations -->
    <rect x="792" y="100" width="178" height="104" rx="6" fill="#ffffff" stroke="#e4e0d9"/>
    <text x="814" y="130" font-size="12" letter-spacing="1.5" fill="#6b6862">SHOPS</text>
    <text x="814" y="176" font-size="40" font-weight="600" fill="#191817">84</text>

    <!-- areas covered -->
    <rect x="980" y="100" width="178" height="104" rx="6" fill="#ffffff" stroke="#e4e0d9"/>
    <text x="1002" y="130" font-size="12" letter-spacing="1.5" fill="#6b6862">AREAS COVERED</text>
    <text x="1002" y="176" font-size="40" font-weight="600" fill="#191817">11</text>
  </g>

  <!-- funnel -->
  <text x="40" y="248" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#6b6862">THE SEASON FUNNEL</text>

  <g font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" fill="#191817">
    <!-- track backgrounds -->
    <g fill="#f0ece5">
      <rect x="200" y="270" width="560" height="26" rx="4"/>
      <rect x="200" y="324" width="560" height="26" rx="4"/>
      <rect x="200" y="378" width="560" height="26" rx="4"/>
      <rect x="200" y="432" width="560" height="26" rx="4"/>
      <rect x="200" y="486" width="560" height="26" rx="4"/>
      <rect x="200" y="540" width="560" height="26" rx="4"/>
    </g>
    <!-- filled bars, widths scaled to 84 = full 560 -->
    <rect x="200" y="270" width="560" height="26" rx="4" fill="#1d5b48"/>
    <rect x="200" y="324" width="247" height="26" rx="4" fill="#1d5b48"/>
    <rect x="200" y="378" width="127" height="26" rx="4" fill="#1d5b48"/>
    <rect x="200" y="432" width="73" height="26" rx="4" fill="#1d5b48"/>
    <rect x="200" y="486" width="40" height="26" rx="4" fill="#1d5b48"/>
    <rect x="200" y="540" width="20" height="26" rx="4" fill="#1d5b48"/>

    <text x="40" y="288">Researched</text>
    <text x="40" y="342">Written to</text>
    <text x="40" y="396">Replied</text>
    <text x="40" y="450">Interested</text>
    <text x="40" y="504">Demo kit sent</text>
    <text x="40" y="558">Stocking</text>

    <text x="775" y="288" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start">84</text>
    <text x="775" y="342" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start">37</text>
    <text x="775" y="396" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start">19</text>
    <text x="775" y="450" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start">11</text>
    <text x="775" y="504" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start">6</text>
    <text x="775" y="558" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start">3</text>
  </g>

  <!-- program coverage table -->
  <text x="40" y="628" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#6b6862">PRODUCT LINE COVERAGE</text>

  <rect x="40" y="648" width="1120" height="160" rx="6" fill="#ffffff" stroke="#e4e0d9"/>
  <line x1="40" y1="688" x2="1160" y2="688" stroke="#f0ece5" stroke-width="1"/>
  <line x1="40" y1="728" x2="1160" y2="728" stroke="#f0ece5" stroke-width="1"/>
  <line x1="40" y1="768" x2="1160" y2="768" stroke="#f0ece5" stroke-width="1"/>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#9b968d">
    <text x="64" y="672">PRODUCT LINE</text>
    <text x="560" y="672">SHOPS</text>
    <text x="900" y="672">STATUS</text>
  </g>

  <g font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" fill="#191817">
    <text x="64" y="712">Road</text>
    <text x="560" y="712" font-family="'IBM Plex Mono', ui-monospace, monospace">52</text>
    <text x="64" y="752">Gravel</text>
    <text x="560" y="752" font-family="'IBM Plex Mono', ui-monospace, monospace">24</text>
    <text x="64" y="792">E-bike</text>
    <text x="560" y="792" font-family="'IBM Plex Mono', ui-monospace, monospace">8</text>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" letter-spacing="1">
    <rect x="900" y="700" width="32" height="16" rx="8" fill="#e9f2ef"/>
    <text x="908" y="712" fill="#1d5b48">OK</text>
    <rect x="900" y="740" width="32" height="16" rx="8" fill="#e9f2ef"/>
    <text x="908" y="752" fill="#1d5b48">OK</text>
    <rect x="900" y="780" width="48" height="16" rx="8" fill="#f6ece0"/>
    <text x="908" y="792" fill="#8f5a06">THIN</text>
  </g>
</svg>
