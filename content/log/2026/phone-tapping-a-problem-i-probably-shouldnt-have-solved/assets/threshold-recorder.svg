<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#23201b"/>
  <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#ece8e1" stroke-opacity="0.10"/>
  <!-- THE THRESHOLD RECORDER. The freeware as a state loop, because that is what
       it was: four stations on one rail and a return path from SAVE back to
       WAIT, the-loop.svg idiom. The live node is RECORD, the only state in which
       the disk is being spent; the whole argument of the section is that the
       machine was idle most of the day. Station x positions derived by
       tile-system.stations(), not typed. -->
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#ece8e1" stroke-opacity="0.5" stroke-width="1.6"/>
    </marker>
  </defs>
  <text x="64" y="96" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="4" fill="#ece8e1" fill-opacity="0.45">THE THRESHOLD RECORDER · CIRCA 2000</text>
  <path d="M 207.2 360 H 497.9" fill="none" stroke="#ece8e1" stroke-opacity="0.35" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M 537.9 360 H 795.7" fill="none" stroke="#ece8e1" stroke-opacity="0.35" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M 901.7 360 H 1159.4" fill="none" stroke="#ece8e1" stroke-opacity="0.35" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M 1178.4 381 V 470 H 516.9 V 379" fill="none" stroke="#ece8e1" stroke-opacity="0.35" stroke-width="2" marker-end="url(#tip)"/>
  <circle cx="186.2" cy="360" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <text x="186.2" y="322" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">SOUND BLASTER</text>
  <circle cx="516.9" cy="360" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <text x="516.9" y="322" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">WAIT</text>
  <circle cx="847.7" cy="360" r="44" fill="#f04a00" fill-opacity="0.12"/>
  <circle cx="847.7" cy="360" r="17" fill="#f04a00"/>
  <text x="847.7" y="322" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.75">RECORD</text>
  <circle cx="1178.4" cy="360" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <text x="1178.4" y="322" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">SAVE</text>
  <text x="186.2" y="420" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="1" fill="#ece8e1" fill-opacity="0.45">line in, all day</text>
  <text x="682.3" y="420" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="1" fill="#ece8e1" fill-opacity="0.45">level above threshold</text>
  <text x="1013.0500000000001" y="420" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="1" fill="#ece8e1" fill-opacity="0.45">quiet long enough</text>
  <text x="847.6500000000001" y="512" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="1" fill="#ece8e1" fill-opacity="0.45">then wait for the next call</text>
  <text x="64" y="660" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="3" fill="#ece8e1" fill-opacity="0.45">NO CALL, NO FILE. THE DISK ONLY FILLED WHEN SOMEBODY TALKED.</text>
</svg>
