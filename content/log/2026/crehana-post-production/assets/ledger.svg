  <line x1="64" y1="130" x2="1216" y2="130" stroke="#ece8e1" stroke-opacity="0.10" stroke-width="1"/>

  <g font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="30" fill="#ece8e1">
    <text x="64" y="220" letter-spacing="3" fill-opacity="0.6">FRAME</text>
    <text x="1216" y="220" letter-spacing="2" text-anchor="end" fill-opacity="0.7">−$3,240 / YR</text>
