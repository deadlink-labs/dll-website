<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#23201b"/>
  <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#ece8e1" stroke-opacity="0.10"/>

  <text x="110" y="140" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="26" letter-spacing="4" fill="#ece8e1" fill-opacity="0.6">WHAT GOT CANCELLED</text>
  <text x="110" y="174" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="16" letter-spacing="3" fill="#ece8e1" fill-opacity="0.4">ANNUAL RUN RATE, REMOVED</text>

  <!-- Line items. A ledger, not a chart: four numbers in a column want a table. -->
  <g font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="26" fill="#ece8e1" fill-opacity="0.72">
    <text x="110" y="270" letter-spacing="3">FRAME</text>
    <text x="1170" y="270" letter-spacing="2" text-anchor="end">−$3,240 / YR</text>
    <text x="110" y="340" letter-spacing="3">TRINT → WHISPER</text>
    <text x="1170" y="340" letter-spacing="2" text-anchor="end">−$12,340 / YR</text>
    <text x="110" y="410" letter-spacing="3">DROPBOX</text>
    <text x="1170" y="410" letter-spacing="2" text-anchor="end">−$840 / YR</text>
  </g>
  <g stroke="#ece8e1" stroke-opacity="0.12" stroke-width="1">
    <line x1="110" y1="292" x2="1170" y2="292"/>
    <line x1="110" y1="362" x2="1170" y2="362"/>
    <line x1="110" y1="432" x2="1170" y2="432"/>
  </g>

  <!-- Subtotal rule, the accounting double-line. -->
  <line x1="110" y1="470" x2="1170" y2="470" stroke="#ece8e1" stroke-opacity="0.3" stroke-width="1"/>

  <circle cx="120" cy="508" r="14" fill="#f04a00" fill-opacity="0.14"/>
  <circle cx="120" cy="508" r="6.5" fill="#f04a00"/>
  <text x="152" y="520" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="34" letter-spacing="4" fill="#ece8e1" fill-opacity="0.5">TOTAL</text>
  <text x="1170" y="524" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="52" font-weight="600" letter-spacing="2" fill="#ece8e1" fill-opacity="0.9">$16,420 / YR</text>

  <!-- Different category: a one-off process change, not a subscription. -->
  <text x="110" y="606" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="20" letter-spacing="3" fill="#ece8e1" fill-opacity="0.4">PLUS AI-ASSISTED TRANSLATION</text>
  <text x="1170" y="606" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="20" letter-spacing="2" fill="#ece8e1" fill-opacity="0.5">−$10,000+</text>
</svg>
