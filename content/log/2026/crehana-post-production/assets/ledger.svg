    <line x1="64" y1="332" x2="1216" y2="332"/>
    <line x1="64" y1="418" x2="1216" y2="418"/>
  </g>

  <!-- Subtotal rule, the accounting double line -->
  <line x1="64" y1="456" x2="1216" y2="456" stroke="#ece8e1" stroke-opacity="0.32" stroke-width="1"/>

  <circle cx="80" cy="550" r="15" fill="#f04a00" fill-opacity="0.14"/>
  <circle cx="80" cy="550" r="7" fill="#f04a00"/>
  <text x="112" y="560" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="4" fill="#ece8e1" fill-opacity="0.5">TOTAL</text>
