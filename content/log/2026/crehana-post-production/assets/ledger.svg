    <text x="1216" y="306" letter-spacing="2" text-anchor="end" fill-opacity="0.7">−$12,340 / YR</text>
    <text x="64" y="392" letter-spacing="3" fill-opacity="0.6">DROPBOX</text>
    <text x="1216" y="392" letter-spacing="2" text-anchor="end" fill-opacity="0.7">−$840 / YR</text>
  </g>
  <g stroke="#ece8e1" stroke-opacity="0.14" stroke-width="1">
