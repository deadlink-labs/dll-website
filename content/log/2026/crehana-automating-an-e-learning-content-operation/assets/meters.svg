<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#23201b"/>
  <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#ece8e1" stroke-opacity="0.10"/>

  <!-- The per-contributor OKR card everyone on the team could open, rebuilt from
       the real dashboard with the name removed. Monthly output against a target
       on the left, quarter goal completion on the right, correction turnaround
       against its SLA below. -->
  <text x="64" y="96" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="4" fill="#ece8e1" fill-opacity="0.45">SELF-SERVED OKR · QUARTER IN PROGRESS</text>

  <!-- Left · monthly output. Baseline 560, 400 minutes scaled to 260px. -->
  <text x="64" y="176" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">MOTION DESIGN · MINUTES / MONTH</text>

  <!-- Target line first, so the bars occlude it. Drawn after, it would cut
       straight through the value labels. Dashed because it marks a threshold,
       not a grid. -->
  <line x1="64" y1="332.5" x2="620" y2="332.5" stroke="#ece8e1" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="620" y="322" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="20" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">TARGET 350</text>

  <g fill="#ece8e1" fill-opacity="0.3">
    <rect x="64" y="365" width="110" height="195" rx="2"/>
    <rect x="287" y="300" width="110" height="260" rx="2"/>
    <rect x="510" y="378" width="110" height="182" rx="2"/>
  </g>
  <line x1="64" y1="560" x2="620" y2="560" stroke="#ece8e1" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Values on one row inside the bars, below the target line. Following each
       bar's top would put the 400 label exactly at the threshold height. -->
  <g text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" font-weight="600" fill="#ece8e1" fill-opacity="0.9">
    <text x="119" y="420">300</text>
    <text x="342" y="420">400</text>
    <text x="565" y="420">280</text>
  </g>
  <g text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">
    <text x="119" y="596">APR</text>
    <text x="342" y="596">MAY</text>
    <text x="565" y="596">JUN</text>
  </g>

  <!-- Right · quarter goal completion. Semicircular gauge, centre (940,440) r150.
       Value arc ends at 82% of goal: theta = 180 - 180*0.82 = 32.4deg, so the end
       point is (940 + 150*cos32.4, 440 - 150*sin32.4). Sweep flag 1 traces it
       clockwise over the top; large-arc flag 0 since the sweep is under 180deg. -->
  <text x="940" y="245" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">QUARTER GOAL</text>

  <path d="M790,440 A150,150 0 0,1 1090,440" fill="none" stroke="#ece8e1" stroke-opacity="0.14" stroke-width="34" stroke-linecap="butt"/>
  <path d="M790,440 A150,150 0 0,1 1066.6,359.6" fill="none" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="34" stroke-linecap="butt"/>
  <circle cx="1066.6" cy="359.6" r="17" fill="#f04a00" fill-opacity="0.14"/>
  <circle cx="1066.6" cy="359.6" r="8" fill="#f04a00" stroke="#23201b" stroke-width="2"/>

  <text x="940" y="420" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="72" font-weight="600" fill="#ece8e1" fill-opacity="0.95">980</text>
  <text x="940" y="456" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">MINUTES</text>

  <text x="940" y="556" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="56" font-weight="600" fill="#ece8e1" fill-opacity="0.8">32H</text>
  <text x="940" y="592" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">CORRECTIONS · SLA 48H</text>
</svg>
