<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#23201b"/>
  <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#ece8e1" stroke-opacity="0.10"/>

  <!-- COVER GRID — content box x 64 → 1216, four stacked zones:
         1 stamp      baseline 100
         2 title      mark 152-230, wordmark baseline 222, subtitle 272
         3 graphic    hairline 320, stations 390-570
         4 legend     drop lines to 622, labels baseline 660
       Every element sits on the same 64px margin rail. This tile stays raster
       (web-thumb feeds the feed card, the clients band and OG cards) and must
       read at three sizes: 176px, 310px, 720px. -->

  <!-- Zone 1 · stamp -->
  <text x="64" y="100" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="4" fill="#ece8e1" fill-opacity="0.5">SHIPPED · CASE STUDY</text>

  <!-- Zone 2 · title block.
       Crehana mark rebuilt on its own 3x3 module grid and flattened to panel ink.
       Cells filled: (0,0) (2,0) (1,1) (2,1) (0,2) (2,2). Module 26, origin 64,152
       — 78px tall against an 86px cap height, so the lockup reads 1.26x rather
       than the 1.55x it was. Group `opacity`, not `fill-opacity`: the rects
       overlap at cell (2,1) to avoid a seam, and per-child alpha would composite
       that cell twice. -->
  <g fill="#ece8e1" opacity="0.72">
    <rect x="116" y="152" width="26" height="78"/>
    <rect x="90" y="178" width="52" height="26"/>
    <rect x="64" y="152" width="26" height="26"/>
    <rect x="64" y="204" width="26" height="26"/>
  </g>
  <text x="178" y="222" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="86" font-weight="600" letter-spacing="8" fill="#ece8e1" fill-opacity="0.9">CREHANA</text>
  <text x="178" y="272" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="30" letter-spacing="4" fill="#ece8e1" fill-opacity="0.55">CONTENT OPERATION → SYSTEM</text>

  <!-- Zone 3 · graphic. The growth staircase: horizontal runs joined by 45°
       risers (the network mark's angle family), climbing to the live node. This
       shape is the read that survives at 176px in the clients band. Stations are
       positioned so the legend labels below land flush on both margins. -->

  <path d="M184,570 L438,570 L498,510 L752,510 L812,450 L1066,450 L1126,390" fill="none" stroke="#ece8e1" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="184" cy="570" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="498" cy="510" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="812" cy="450" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="1126" cy="390" r="36" fill="#f04a00" fill-opacity="0.12"/>
  <circle cx="1126" cy="390" r="15" fill="#f04a00"/>

  <!-- Zone 4 · legend, one label per station. -->
  <g text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="30" letter-spacing="2" fill="#ece8e1">
    <text x="184" y="660" fill-opacity="0.45">SPREADSHEETS</text>
    <text x="498" y="660" fill-opacity="0.45">DASHBOARDS</text>
    <text x="812" y="660" fill-opacity="0.45">ONE BOARD</text>
    <text x="1126" y="660" fill-opacity="0.6">AUTOMATED</text>
  </g>
</svg>
