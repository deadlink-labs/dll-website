<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- ===================================================================
       DEL AUDIO AL INFORME - the client deck's slide 04, rebuilt at this
       canvas size. Icons are the deck's own paths, not substitutes.
       The technician is green (he is the only human step), the report is
       accent orange (the only thing that reaches a customer), everything
       between is steel because it is infrastructure.
       Connectors animate; the keyframe and the reduced-motion guard are
       in this file so it works opened anywhere.
       =================================================================== -->
  <style>
    @keyframes flowdash { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) {
      [style*="flowdash"] { animation: none !important; }
    }
  </style>
  <rect width="1280" height="640" fill="#F1EFEA"/>

  <text x="64" y="76" font-family="'IBM Plex Mono',monospace" font-size="20" letter-spacing="3" fill="#8A8377">DEL AUDIO AL INFORME, PASO A PASO</text>

  <!-- ── connectors ───────────────────────────────────────────────── -->
  <g stroke="#C6C0B5" stroke-width="2" stroke-dasharray="6 6" style="animation:flowdash 1.1s linear infinite">
    <path d="M210,196 H302"/><path d="M402,196 H494"/><path d="M594,196 H686"/>
    <path d="M786,196 H878"/><path d="M978,196 H1070"/>
  </g>

  <!-- ── 01 · the only human step ─────────────────────────────────── -->
  <circle cx="160" cy="196" r="38" fill="#2E7D5B"/>
  <g transform="translate(146,182)" fill="#FFFFFF">
    <path d="M12 2.2A9.7 9.7 0 0 0 3.7 17L2.3 21.7l4.9-1.4A9.7 9.7 0 1 0 12 2.2zm0 1.9a7.8 7.8 0 1 1-4 14.5l-.4-.2-2.5.7.7-2.4-.25-.4A7.8 7.8 0 0 1 12 4.1z"/>
    <path d="M9.1 7.6c-.16-.36-.33-.37-.48-.38h-.4a.79.79 0 0 0-.57.27 2.4 2.4 0 0 0-.75 1.79A4.2 4.2 0 0 0 7.8 11a8.5 8.5 0 0 0 3.55 3.12c1.72.68 2.07.54 2.44.5a2.1 2.1 0 0 0 1.4-.98 1.7 1.7 0 0 0 .12-.98c-.05-.09-.18-.14-.38-.24s-1.19-.59-1.37-.65-.32-.1-.45.1-.52.65-.63.78-.23.15-.43.05a6.9 6.9 0 0 1-2.03-1.25 7.6 7.6 0 0 1-1.4-1.75c-.15-.25 0-.38.1-.5s.22-.26.33-.4a1.5 1.5 0 0 0 .22-.36.4.4 0 0 0 0-.38c-.06-.1-.45-1.1-.62-1.5z"/>
  </g>

  <!-- ── 02 to 05 · infrastructure ────────────────────────────────── -->
  <circle cx="352" cy="196" r="38" fill="#FFFFFF" stroke="#CDD6DB" stroke-width="2"/>
  <g transform="translate(338,182)" fill="none" stroke="#2C566E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5h16v11H9l-5 4V5z"/><path d="M8.5 10.2l2 2 4.2-4.2"/>
  </g>

  <circle cx="544" cy="196" r="38" fill="#FFFFFF" stroke="#CDD6DB" stroke-width="2"/>
  <g transform="translate(530,182)" fill="none" stroke="#2C566E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>
  </g>

  <circle cx="736" cy="196" r="38" fill="#FFFFFF" stroke="#CDD6DB" stroke-width="2"/>
  <g transform="translate(722,182)" fill="none" stroke="#2C566E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
  </g>

  <circle cx="928" cy="196" r="38" fill="#FFFFFF" stroke="#CDD6DB" stroke-width="2"/>
  <g transform="translate(914,182)" fill="none" stroke="#2C566E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.3v.5"/><path d="M12 17.2h.01"/>
  </g>

  <!-- ── 06 · the only thing a customer sees ──────────────────────── -->
  <circle cx="1120" cy="196" r="38" fill="#C0451A"/>
  <g transform="translate(1106,182)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/><path d="M9 13.5h6M9 17h4"/>
  </g>

  <!-- ── numbers ──────────────────────────────────────────────────── -->
  <g text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22" letter-spacing="2" fill="#2E7D5B">
    <text x="160" y="290">01</text>
  </g>
  <g text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22" letter-spacing="2" fill="#8A8377">
    <text x="352" y="290">02</text><text x="544" y="290">03</text><text x="736" y="290">04</text><text x="928" y="290">05</text>
  </g>
  <g text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22" letter-spacing="2" fill="#C0451A">
    <text x="1120" y="290">06</text>
  </g>

  <!-- ── titles ───────────────────────────────────────────────────── -->
  <g text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="21" font-weight="600" fill="#14181B">
    <text x="160" y="330">Manda un audio</text>
    <text x="352" y="330">Acuse inmediato</text>
    <text x="544" y="330">Se transcribe</text>
    <text x="544" y="360">local</text>
    <text x="736" y="330">La IA ordena</text>
    <text x="928" y="330">Si falta algo,</text>
    <text x="928" y="360">pregunta</text>
    <text x="1120" y="330">Informe +</text>
    <text x="1120" y="358">histórico</text>
  </g>

  <!-- ── descriptions ─────────────────────────────────────────────── -->
  <g text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="17" fill="#5A6470">
    <text x="160" y="404">Cuenta qué hizo por</text>
    <text x="160" y="430">WhatsApp al terminar.</text>
    <text x="160" y="456">Si sacó fotos, las</text>
    <text x="160" y="482">adjunta.</text>

    <text x="352" y="404">«Recibido, generando</text>
    <text x="352" y="430">el informe.»</text>

    <text x="544" y="404">Dentro del servidor</text>
    <text x="544" y="430">de la intranet. No</text>
    <text x="544" y="456">se filtran datos al</text>
    <text x="544" y="482">exterior.</text>

    <text x="736" y="404">Cliente, equipo,</text>
    <text x="736" y="430">N.º de serie, falla,</text>
    <text x="736" y="456">causa, trabajo,</text>
    <text x="736" y="482">repuestos.</text>

    <text x="928" y="404">El técnico contesta</text>
    <text x="928" y="430">y el informe se</text>
    <text x="928" y="456">cierra en la base</text>
    <text x="928" y="482">de datos local.</text>

    <text x="1120" y="404">PDF con el formato</text>
    <text x="1120" y="430">de la empresa. El</text>
    <text x="1120" y="456">dato queda</text>
    <text x="1120" y="482">consultable.</text>
  </g>

  <!-- ── the line the whole slide exists to deliver ───────────────── -->
  <rect x="64" y="536" width="1152" height="72" rx="4" fill="#FBF3EE"/>
  <rect x="64" y="536" width="4" height="72" fill="#C0451A"/>
  <text x="100" y="580" font-family="'IBM Plex Sans',sans-serif" font-size="23" fill="#14181B">El técnico participa sólo del paso 01. Todo lo demás corre sin que él espere a nadie.</text>
</svg>
