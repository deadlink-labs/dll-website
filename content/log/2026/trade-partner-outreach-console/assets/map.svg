<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#f7f6f3"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#e4e0d9" stroke-width="1"/>
  <text x="40" y="34" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#191817" font-weight="600">TRADE OUTREACH</text>
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" letter-spacing="1">
    <text x="620" y="33" fill="#6b6862">OVERVIEW</text>
    <text x="730" y="33" fill="#6b6862">QUEUE</text>
    <text x="800" y="33" fill="#6b6862">ORGANIZATIONS</text>
    <text x="960" y="33" fill="#6b6862">PARTNERS</text>
    <text x="1070" y="33" fill="#1d5b48" font-weight="600">MAP</text>
  </g>
  <rect x="1070" y="42" width="34" height="2" fill="#1d5b48"/>

  <text x="40" y="112" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#6b6862">COVERAGE, NOT GEOGRAPHY</text>

  <!-- grid: 11 cols x 5 rows, cell 96x64, gap 8 -->
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="600" text-anchor="middle">

    <!-- row 1: AL AK AZ AR CA CO CT DE FL GA HI -->
    <g>
      <rect x="32" y="160" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="80" y="198" fill="#1d5b48">AL</text>
      <rect x="136" y="160" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="184" y="198" fill="#1d5b48">AK</text>
      <rect x="240" y="160" width="96" height="64" rx="4" fill="#8fbfa8"/><text x="288" y="198" fill="#ffffff">AZ</text>
      <rect x="344" y="160" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="392" y="198" fill="#1d5b48">AR</text>
      <rect x="448" y="160" width="96" height="64" rx="4" fill="#1d5b48"/><text x="496" y="198" fill="#ffffff">CA</text>
      <rect x="552" y="160" width="96" height="64" rx="4" fill="#1d5b48"/><text x="600" y="198" fill="#ffffff">CO</text>
      <rect x="656" y="160" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="704" y="198" fill="#1d5b48">CT</text>
      <rect x="760" y="160" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="808" y="198" fill="#1d5b48">DE</text>
      <rect x="864" y="160" width="96" height="64" rx="4" fill="#1d5b48"/><text x="912" y="198" fill="#ffffff">FL</text>
      <rect x="968" y="160" width="96" height="64" rx="4" fill="#8fbfa8"/><text x="1016" y="198" fill="#ffffff">GA</text>
      <rect x="1072" y="160" width="96" height="64" rx="4" fill="#f0ece5"/><text x="1120" y="198" fill="#9b968d">HI</text>
    </g>

    <!-- row 2: ID IL IN IA KS KY LA ME MD MA MI -->
    <g>
      <rect x="32" y="232" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="80" y="270" fill="#1d5b48">ID</text>
      <rect x="136" y="232" width="96" height="64" rx="4" fill="#8fbfa8"/><text x="184" y="270" fill="#ffffff">IL</text>
      <rect x="240" y="232" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="288" y="270" fill="#1d5b48">IN</text>
      <rect x="344" y="232" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="392" y="270" fill="#1d5b48">IA</text>
      <rect x="448" y="232" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="496" y="270" fill="#1d5b48">KS</text>
      <rect x="552" y="232" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="600" y="270" fill="#1d5b48">KY</text>
      <rect x="656" y="232" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="704" y="270" fill="#1d5b48">LA</text>
      <rect x="760" y="232" width="96" height="64" rx="4" fill="#f0ece5" stroke="#9b968d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="808" y="270" fill="#9b968d">ME</text>
      <rect x="864" y="232" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="912" y="270" fill="#1d5b48">MD</text>
      <rect x="968" y="232" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="1016" y="270" fill="#1d5b48">MA</text>
      <rect x="1072" y="232" width="96" height="64" rx="4" fill="#8fbfa8"/><text x="1120" y="270" fill="#ffffff">MI</text>
    </g>

    <!-- row 3: MN MS MO MT NE NV NH NJ NM NY NC -->
    <g>
      <rect x="32" y="304" width="96" height="64" rx="4" fill="#8fbfa8"/><text x="80" y="342" fill="#ffffff">MN</text>
      <rect x="136" y="304" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="184" y="342" fill="#1d5b48">MS</text>
      <rect x="240" y="304" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="288" y="342" fill="#1d5b48">MO</text>
      <rect x="344" y="304" width="96" height="64" rx="4" fill="#f0ece5" stroke="#9b968d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="392" y="342" fill="#9b968d">MT</text>
      <rect x="448" y="304" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="496" y="342" fill="#1d5b48">NE</text>
      <rect x="552" y="304" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="600" y="342" fill="#1d5b48">NV</text>
      <rect x="656" y="304" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="704" y="342" fill="#1d5b48">NH</text>
      <rect x="760" y="304" width="96" height="64" rx="4" fill="#d7ebe3"/><text x="808" y="342" fill="#1d5b48">NJ</text>
      <rect x="864" y="304" width="96" height="64" rx="4" fill="#f0ece5"/><text x="912" y="342" fill="#9b968d">NM</text>
      <rect x="968" y="304" width="96" height="64" rx="4" fill="#1d5b48"/><text x="1016" y="342" fill="#ffffff">NY</text>
      <rect x="1072" y="304" width="96" height="64" rx="4" fill="#8fbfa8"/><text x="1120" y="342" fill="#ffffff">NC</text>
    </g>

    <!-- row 4: ND OH OK OR PA RI SC SD TN TX UT -->
    <g>
      <rect x="32" y="376" width="96" height="64" rx="4" fill="#f0ece5" stroke="#9b968d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="80" y="414" fill="#9b968d">ND</text>
      <rect x="136" y="376" width="96" height="64" rx="4" fill="#8fbfa8"/><text x="184" y="414" fill="#ffffff">OH</text>
      <rect x="240" y="376" width="96" height="64" rx="4" fill="#f0ece5"/><text x="288" y="414" fill="#9b968d">OK</text>
      <rect x="344" y="376" width="96" height="64" rx="4" fill="#f0ece5"/><text x="392" y="414" fill="#9b968d">OR</text>
      <rect x="448" y="376" width="96" height="64" rx="4" fill="#8fbfa8"/><text x="496" y="414" fill="#ffffff">PA</text>
      <rect x="552" y="376" width="96" height="64" rx="4" fill="#f0ece5"/><text x="600" y="414" fill="#9b968d">RI</text>
      <rect x="656" y="376" width="96" height="64" rx="4" fill="#f0ece5"/><text x="704" y="414" fill="#9b968d">SC</text>
