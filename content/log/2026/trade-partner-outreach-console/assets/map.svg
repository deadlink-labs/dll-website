      <rect x="864" y="376" width="96" height="64" rx="4" fill="#8fbfa8"/><text x="912" y="414" fill="#ffffff">TN</text>
      <rect x="968" y="376" width="96" height="64" rx="4" fill="#1d5b48"/><text x="1016" y="414" fill="#ffffff">TX</text>
      <rect x="1072" y="376" width="96" height="64" rx="4" fill="#f0ece5"/><text x="1120" y="414" fill="#9b968d">UT</text>
    </g>

    <!-- row 5: VT VA WA WV WI WY (remaining cells intentionally blank grid space) -->
    <g>
      <rect x="32" y="448" width="96" height="64" rx="4" fill="#f0ece5"/><text x="80" y="486" fill="#9b968d">VT</text>
      <rect x="136" y="448" width="96" height="64" rx="4" fill="#f0ece5"/><text x="184" y="486" fill="#9b968d">VA</text>
      <rect x="240" y="448" width="96" height="64" rx="4" fill="#8fbfa8"/><text x="288" y="486" fill="#ffffff">WA</text>
      <rect x="344" y="448" width="96" height="64" rx="4" fill="#f0ece5"/><text x="392" y="486" fill="#9b968d">WV</text>
      <rect x="448" y="448" width="96" height="64" rx="4" fill="#f0ece5"/><text x="496" y="486" fill="#9b968d">WI</text>
      <rect x="552" y="448" width="96" height="64" rx="4" fill="#f0ece5" stroke="#9b968d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="600" y="486" fill="#9b968d">WY</text>
    </g>
  </g>

  <!-- legend -->
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" letter-spacing="1">
    <rect x="32" y="548" width="20" height="20" rx="3" fill="#f0ece5"/>
    <text x="60" y="563" fill="#6b6862">NONE</text>

    <rect x="152" y="548" width="20" height="20" rx="3" fill="#f0ece5" stroke="#9b968d" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="180" y="563" fill="#6b6862">TARGETED, NOT YET SWEPT</text>

    <rect x="440" y="548" width="20" height="20" rx="3" fill="#d7ebe3"/>
    <text x="468" y="563" fill="#6b6862">1-2</text>

    <rect x="540" y="548" width="20" height="20" rx="3" fill="#8fbfa8"/>
    <text x="568" y="563" fill="#6b6862">3-5</text>

    <rect x="640" y="548" width="20" height="20" rx="3" fill="#1d5b48"/>
    <text x="668" y="563" fill="#6b6862">6+</text>
  </g>
</svg>
