<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#23201b"/>
  <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#ece8e1" stroke-opacity="0.10"/>

  <!-- WHERE THE CONTENT LIVES. Two lanes, compared. The upper lane is what a CMS
       costs you: the content exists in the editor and again in a database, so
       there are two places it can drift. The lower lane is this site.

       THE LANES ARE SEPARATED BY AIR, NOT BY A RULE. A hairline between them
       would be a separator, which the tile system bans — only chart elements may
       be lines, and the two lane spines qualify. Lane A occupies y 168-310 and
       lane B y 393-558, which leaves 83px of ground between them.

       The comparison is carried by SIZE, not by colour: 72 at 0.55 against 120
       at 0.95. Both lanes are otherwise identical ink, so the only orange on the
       tile is the vault note — the single source everything else derives from. -->

  <text x="64" y="96" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="4" fill="#ece8e1" fill-opacity="0.45">WHERE THE CONTENT LIVES</text>

  <!-- ══ LANE A · the usual way ════════════════════════════════════════ -->
  <text x="64" y="190" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">THE USUAL WAY</text>

  <g text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">
    <text x="430" y="225">EDITOR</text>
    <text x="645" y="225">CMS DATABASE</text>
    <text x="860" y="225">SITE</text>
  </g>

  <line x1="430" y1="260" x2="860" y2="260" stroke="#ece8e1" stroke-opacity="0.25" stroke-width="2"/>
  <g fill="#23201b" stroke="#ece8e1" stroke-opacity="0.5" stroke-width="2">
    <circle cx="430" cy="260" r="11"/>
    <circle cx="645" cy="260" r="11"/>
    <circle cx="860" cy="260" r="11"/>
  </g>

  <text x="1216" y="275" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="72" font-weight="600" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">2</text>
  <text x="1216" y="310" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">COPIES OF THE CONTENT</text>

  <!-- ══ LANE B · this site ═══════════════════════════════════════════ -->
  <text x="64" y="415" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">THIS SITE</text>

  <g text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="2" fill="#ece8e1" fill-opacity="0.45">
    <text x="430" y="450">VAULT NOTE</text>
    <text x="860" y="450">SITE</text>
  </g>

  <line x1="430" y1="500" x2="860" y2="500" stroke="#ece8e1" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="860" cy="500" r="11" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.5" stroke-width="2"/>

  <!-- the one live node: the source everything else is derived from -->
  <circle cx="430" cy="500" r="44" fill="#f04a00" fill-opacity="0.12"/>
  <circle cx="430" cy="500" r="17" fill="#f04a00"/>

  <text x="1216" y="515" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="120" font-weight="600" letter-spacing="2" fill="#ece8e1" fill-opacity="0.95">1</text>
  <text x="1216" y="558" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">COPY OF THE CONTENT</text>

  <text x="64" y="660" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="3" fill="#ece8e1" fill-opacity="0.45">THE VAULT IS THE SOURCE. THERE IS NO SECOND COPY.</text>
</svg>
