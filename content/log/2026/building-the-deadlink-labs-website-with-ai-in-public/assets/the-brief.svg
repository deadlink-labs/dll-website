<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#23201b"/>
  <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#ece8e1" stroke-opacity="0.10"/>

  <!-- THE BRIEF. One premise opens into three documents and all three close onto
       a single file. The drawing's argument is the CLOSING, so the live node is
       CLAUDE.md and nothing else on the tile is orange.

       FIRST PASS WAS WRONG AND IS WORTH RECORDING. It fanned out and back with
       right angles — two vertical brackets joined by a top and bottom rail —
       which draws a closed RECTANGLE. It read as a container with labels inside
       it, the opposite of a convergence. Replacing the brackets with 45° legs
       makes the shape a lens: it opens, then it closes, and the eye follows it
       to the one node on the right.

       Horizontal and 45° only, the angle families of the network mark. The
       y=360 line runs unbroken from the premise to the live node, so the middle
       document is also the through-line.

       Labels sit 18px ABOVE their rails so no line ever crosses type, and the
       diagonals all begin at x=280 or x=980, clear of every label box.

       NO HERO NUMBER, deliberately. It carried "1 / FILE THE AI READS" for a
       pass, and the number only restated what the geometry already says: three
       things arrive at one node. A count that duplicates the drawing is clutter,
       and it made this tile look like the stat tiles it sits beside. Topology
       diagrams here follow the link-chain idiom and carry no hero. -->

  <text x="64" y="96" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="4" fill="#ece8e1" fill-opacity="0.45">THE BRIEF</text>

  <g stroke="#ece8e1" stroke-opacity="0.25" stroke-width="2" fill="none">
    <!-- the through-line: premise, the middle document, the brief -->
    <line x1="160" y1="360" x2="1083" y2="360"/>
    <!-- opening: 45° out to the upper and lower documents -->
    <line x1="280" y1="360" x2="400" y2="240"/>
    <line x1="280" y1="360" x2="400" y2="480"/>
    <!-- the two outer documents run level -->
    <line x1="400" y1="240" x2="980" y2="240"/>
    <line x1="400" y1="480" x2="980" y2="480"/>
    <!-- closing: 45° back in, onto one file -->
    <line x1="980" y1="240" x2="1100" y2="360"/>
    <line x1="980" y1="480" x2="1100" y2="360"/>
  </g>

  <!-- ── the premise, and the three documents that grow from it ───────── -->
  <circle cx="160" cy="360" r="13" fill="#23201b" stroke="#ece8e1" stroke-opacity="0.6" stroke-width="2"/>
  <text x="160" y="415" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">PREMISE</text>

  <g fill="#23201b" stroke="#ece8e1" stroke-opacity="0.5" stroke-width="2">
    <circle cx="400" cy="240" r="11"/>
    <circle cx="400" cy="360" r="11"/>
    <circle cx="400" cy="480" r="11"/>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.55">
    <text x="440" y="222">BLUEPRINT · THE WHY</text>
    <text x="440" y="342">DESIGN · LOOK AND FEEL</text>
    <text x="440" y="462">STRUCTURE · HOW IT WORKS</text>
  </g>

  <!-- ── everything closes here ───────────────────────────────────────── -->
  <text x="1216" y="272" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="28" letter-spacing="2" fill="#ece8e1" fill-opacity="0.75">CLAUDE.md</text>
  <circle cx="1100" cy="360" r="44" fill="#f04a00" fill-opacity="0.12"/>
  <circle cx="1100" cy="360" r="17" fill="#f04a00"/>

  <text x="64" y="660" font-family="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" letter-spacing="3" fill="#ece8e1" fill-opacity="0.45">ONE CLEAR BRIEF BEATS A HUNDRED SMALL CORRECTIONS.</text>
</svg>
